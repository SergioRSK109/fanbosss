name: Deploy Supabase migrations

# Runs whenever a push to main actually changes something under
# supabase/migrations/ -- not on every push, so unrelated app code changes
# don't spend CI minutes re-linking to Supabase for nothing.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  # Manual re-run from the Actions tab, e.g. after fixing a secret without
  # needing an empty commit to re-trigger the path filter above.
  workflow_dispatch:

# Only one deployment at a time, and never cancel one that's already
# running mid-push -- a cancelled `supabase db push` could leave the
# migration history table out of sync with what was actually applied.
concurrency:
  group: deploy-supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase db push
    runs-on: ubuntu-latest
    # No `continue-on-error` anywhere in this job and no `|| true` on any
    # step below -- a failing `supabase db push` (bad SQL, connection
    # failure, etc.) must fail this job and the workflow run, full stop.
    # GitHub already surfaces that as a red X on the commit/PR and in the
    # Actions tab; see the README's Supabase CI section for what that
    # looks like and what to do about it.
    #
    # Both secrets are needed across the link + push steps below (the CLI
    # uses SUPABASE_ACCESS_TOKEN for the Management API call `link` makes,
    # and SUPABASE_DB_PASSWORD for the direct Postgres connection `db push`
    # makes) -- set at job level, matching Supabase's own documented
    # example, rather than guessing which single step needs which one.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Push new migrations
        run: supabase db push
